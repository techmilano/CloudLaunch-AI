# Netlify configuration for the CloudLaunchAI marketing site.
# Static Astro build: no functions, no server, no paid add-ons required.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Baseline security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Fingerprinted build assets can be cached for a long time.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep utility pages out of search results.
[[headers]]
  for = "/thanks/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/privacy/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Send the www host to the apex domain (only takes effect once www is added in Netlify).
[[redirects]]
  from = "https://www.cloudlaunchai.com/*"
  to = "https://cloudlaunchai.com/:splat"
  status = 301
  force = true
